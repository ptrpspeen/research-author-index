name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r plugins/research-author-index/requirements.txt
      - run: python -m unittest discover -s plugins/research-author-index/tests -v
      - run: python plugins/research-author-index/scripts/build_share_zip.py --output dist/research-author-index-marketplace.zip --plugin-output dist/research-author-index-plugin.zip
